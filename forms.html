        <div id="top">
            <div class="h1 bg-primary text-white">
                <h1>Contact Form</h1>
            </div>
        </div>
        <div id="middle">
            <!--Source - https://stackoverflow.com/q/54122070. Posted by Joey, modified by community. See post 'Timeline' for change history. Retrieved 2026-06-07, License - CC BY-SA 4.0-->
            <form action="index.html" class="contact-us-form">
                <label for="name">Name:*</label>
                <input type="text" id="name" required></input>
                <label for="contact-email">Email:*</label>
                <input type="email" id="contact-email" required></input>
                <label for="contact-tel">Tel:*</label>
                <input type="tel" id="contact-tel" required></input>
                <label for="subject">Subject:*</label>
                <input type="text" id="subject" required></input>
                <label for="message">Message:*</label>
                <textarea id="message" rows="15" id="message"></textarea>
            </form>
        </div>
        <div id="bottom">
            <button type="submit" class="button">SEND</button>
        </div>


    </body>
